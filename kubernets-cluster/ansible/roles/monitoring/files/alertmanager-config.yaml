global:
  smtp_smarthost: "smtp.yourdomain.com:25"
  smtp_from: "alerts@yourdomain.com"
  smtp_require_tls: false
  smtp_hello: "alertmanager"

route:
  group_by: ["alertname", "namespace", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: "email-alerts"
  routes:
    - match:
        severity: critical
      receiver: "email-alerts"
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: "email-alerts"
      repeat_interval: 6h

receivers:
  - name: "email-alerts"
    email_configs:
      - to: "team@yourdomain.com"
        from: "alerts@yourdomain.com"
        smarthost: "smtp.yourdomain.com:25"
        require_tls: false
        send_resolved: true
        headers:
          Subject: "[K8s Alert] {{ .GroupLabels.alertname }} - {{ .Status | toUpper }}"
        html: |
          <h2>{{ .GroupLabels.alertname }}</h2>
          <p><b>Status:</b> {{ .Status | toUpper }}</p>
          <p><b>Namespace:</b> {{ .GroupLabels.namespace }}</p>
          {{ range .Alerts }}
          <p><b>Summary:</b> {{ .Annotations.summary }}</p>
          <p><b>Description:</b> {{ .Annotations.description }}</p>
          <p><b>Started:</b> {{ .StartsAt }}</p>
          {{ end }}

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "namespace"]
